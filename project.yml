name: Siply
options:
  bundleIdPrefix: info.pisarev
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2C2N587UW8
targets:
  Siply:
    type: application
    platform: iOS
    sources: [Siply]
    info:
      path: Siply/Info.plist
      properties:
        CFBundleDisplayName: Siply
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mp3
              - public.mpeg-4-audio
              - public.aac-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
              - com.apple.coreaudio-format
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.pisarev.siply-ios
        PRODUCT_NAME: Siply
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SiplyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SiplyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Siply
schemes:
  Siply:
    build:
      targets:
        Siply: all
        SiplyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SiplyTests]
